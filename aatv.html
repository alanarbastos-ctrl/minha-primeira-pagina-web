<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio</title>
  <link rel="stylesheet" href="atv.css">
</head>
<body>

  <header>
    <h1><strong>Atividade Github- Lista desafios</strong></h1>
  </header>

  <div class="box">
    <form action="" onsubmit="return false;">

      <input type="text" id="input_desafio" placeholder="qual a tarefa?">
      <button type="submit" id="bt_add">confirm</button>

      <h3>Desafios cadastrados na lista:</h3>

      <ul id="lista_desafios"></ul>

    </form>
  </div>

  <script>
    let vetor_desafios = [];

    const inputDesafio = document.getElementById('input_desafio');
    const btAdicionar = document.getElementById('bt_add');
    const listaDesafios = document.getElementById('lista_desafios');

    function alimentarVetor(desafioAdd){
      vetor_desafios.push(desafioAdd);
      criarLista();
    }

    btAdicionar.addEventListener('click', function(){
      const desafioDigitado = inputDesafio.value.trim();

      if (desafioDigitado === "") {
        return;
      }

      alimentarVetor(desafioDigitado);
      inputDesafio.value = "";
    });

    function criarLista() {
      listaDesafios.innerHTML = "";

      for (let i = 0; i < vetor_desafios.length; i++) {
        const li = document.createElement('li');

        li.textContent = "Desafio: " + vetor_desafios[i];

        const btnRemover = document.createElement('button');
        btnRemover.textContent = "Remover";
        btnRemover.style.marginLeft = "10px";

        btnRemover.onclick = function() {
          removerDesafio(i);
        }

        li.appendChild(btnRemover);
        listaDesafios.appendChild(li);
      }
    }

    function removerDesafio(indice) {
      vetor_desafios.splice(indice, 1);
      criarLista();
    }
  </script>
</body>
</html>
